# Render Blueprint: Ethiopian Startup School - Django backend only.
# Frontend stays on Vercel. Database, Storage, Auth stay on existing Supabase.
# No secrets in this file. Fill secret values in Render dashboard.
services:
  - type: web
    name: ethiopian-startup-school-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_PROXY_SSL_HEADER
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: FRONTEND_BASE_URL
        value: https://ethiopian-startup-school-frontend.vercel.app
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://ethiopian-startup-school-frontend.vercel.app
      - key: GUNICORN_WORKERS
        value: "3"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_PUBLIC_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false