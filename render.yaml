# Render Blueprint: Ethiopian Startup School - Django backend only.
# Frontend stays on Vercel. Database, Storage, Auth stay on existing Supabase.
# No secrets in this file. Fill secret values in Render dashboard.
services:
  - type: web
    name: business-plan-development-course
    runtime: static
    buildCommand: node scripts/build-course-site.mjs
    staticPublishPath: course-site/dist
    autoDeploy: true

  - type: web
    name: ethiopian-startup-school-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED_BUSINESS_PLAN_DEVELOPMENT
        value: "true"
      - key: DJANGO_SECURE_PROXY_SSL_HEADER
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: FRONTEND_BASE_URL
        value: https://ethiopian-startup-school-frontend.vercel.app
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://ethiopian-startup-school-frontend.vercel.app
      - key: LIVEKIT_URL
        value: wss://ethiopian-startup-school-baxgwqhq.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: no-reply@ethiopianstartupschool.com
      - key: EMAIL_TIMEOUT
        value: "30"
      # Required for meeting invitations when Render blocks outbound SMTP.
      - key: RESEND_API_KEY
        sync: false
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_PUBLIC_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false